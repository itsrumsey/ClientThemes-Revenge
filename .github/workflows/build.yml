name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Package review artifact
        run: |
          cp LICENSE README.md dist/ClientThemes/
          cp PROJECT_STATUS.md dist/ClientThemes/
          cp LICENSE dist/HideQuests/
      - uses: actions/upload-artifact@v4
        with:
          name: ClientThemes-review-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/ClientThemes/
            dist/HideQuests/
