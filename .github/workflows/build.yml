name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Preserve dependency lock for baseline verification
        run: |
          echo LOCKFILE_START
          cat package-lock.json
          echo LOCKFILE_END
      - uses: actions/upload-artifact@v4
        with:
          name: ClientThemes-baseline
          path: |
            dist/ClientThemes/
            package-lock.json
            LICENSE
