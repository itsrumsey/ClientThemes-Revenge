name: Next ClientThemes review
on:
  push:
    branches: [revenge-next-client-themes]
    paths: ['next/**', '.github/workflows/next-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        id: install
        with:
          name: ClientThemes-Next-installable
          path: next/build/install/
          if-no-files-found: error
      - name: Verify the actual downloaded Actions ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/${{ steps.install.outputs.artifact-id }}/zip > build/downloaded-artifact.zip
          python3 -c "from scripts.package import validate_package; validate_package('build/downloaded-artifact.zip'); print('Downloaded ZIP has root manifest and script')"
